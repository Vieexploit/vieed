[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vieed"
version = "1.0.0"
description = "Modern, Minimalist & Smart Offline TUI Text Editor"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vieexploit", url = "https://github.com/vieexploit" }]
dependencies = [
    "textual>=1.0.0,<3.0.0",
    "pygments>=2.18.0",
    "httpx>=0.27.0",
]

[project.scripts]
vieed = "vieed:main"

[tool.setuptools]
py-modules = ["vieed"]
